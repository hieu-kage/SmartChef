services:
  vector_db:
    image: qdrant/qdrant:v1.8.4
    ports:
      - "${QDRANT_PORT_EXT:-6333}:6333"
    volumes:
      - ./vector-db/data_${COMPOSE_PROJECT_NAME:-smartchef}:/qdrant/storage


  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartchef_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT_EXT:-5432}:5432"
    volumes:
      - ./postgres/data_${COMPOSE_PROJECT_NAME:-smartchef}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-smartchef_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_app:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.example
    ports:
      - "${API_PORT_EXT:-8000}:8000"
    depends_on:
      vector_db:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./ai_services:/app
