services:
  vector_db:
    image: qdrant/qdrant:v1.8.4
    environment:
      - QDRANT__SERVICE__HTTP_PORT=${QDRANT_PORT_EXT:-6333}
    ports:
      - "${QDRANT_PORT_EXT:-6333}:${QDRANT_PORT_EXT:-6333}"
    volumes:
      - ./vector-db/data_${COMPOSE_PROJECT_NAME:-smartchef}:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${QDRANT_PORT_EXT:-6333}/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartchef_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    command: postgres -p ${POSTGRES_PORT_EXT:-5432}
    ports:
      - "${POSTGRES_PORT_EXT:-5432}:${POSTGRES_PORT_EXT:-5432}"
    volumes:
      - ./postgres/data_${COMPOSE_PROJECT_NAME:-smartchef}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -p ${POSTGRES_PORT_EXT:-5432} -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-smartchef_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_app:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - QDRANT_HOST=vector_db
      - POSTGRES_HOST=postgres
    ports:
      - "${API_PORT_EXT:-8000}:8000"
    depends_on:
      vector_db:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./ai_services:/app
